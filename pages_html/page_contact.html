<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.3/font/bootstrap-icons.min.css">
    <link href="css/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body>
<div class="row"> <!-- Основной блок для работы с колонками -->
    <div class="col-2"> <!-- Колонка шириной 2/12 для размещения меню -->
        <nav class="navbar navbar-dark bg-dark text-white vh-100">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="css/icons8-bootstrap.svg" alt="" width="32" height="25"
                         class="d-inline-block align-text-top">
                    Меню
                </a>
                <ul class="nav flex-column" style="height: 100vh">
                    <li class="nav-item bg-dark text-white">
                        <a class="nav-link active" aria-current="page" href="#">
                            <i class="bi bi-house"></i> Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-journal"></i> Категории</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-card-checklist"></i> Заказы</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-person"></i> Контакты</a>
                    </li>
                </ul>
            </div>
            <div class="btn-group dropup position-absolute bottom-0 start-0 mb-3 ms-3">
                <button type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown"
                        aria-expanded="false">
                    Пользователь
                </button>
                <ul class="dropdown-menu bg-secondary">
                    <li>
                        <button class="dropdown-item" type="button">Профиль</button>
                    </li>
                    <li>
                        <button class="dropdown-item" type="button">Выход</button>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
    <div class="col-10"><!-- Колонка шириной 10/12 для размещения основного контента -->
        <div class="row mt-5 text-center">
            <div class="col-1"></div>
            <div class="col-10">
                <H2>Контакты</H2>
                <div class="row mt-5 text-start">
                    <div class="col-sm-6 mb-3 mb-sm-0">
                        <div class="card">
                            <div class="card-body">
                                <form>
                                    <label for="inputPassword5" class="form-label">Имя</label>
                                    <input type="password" id="inputPassword5" class="form-control"
                                           aria-describedby="passwordHelpBlock">
                                    <label for="basic-addon1" class="form-label">Почта</label>
                                    <div class="input-group mb-3">
                                        <span class="input-group-text" id="basic-addon1">@</span>
                                        <input type="text" class="form-control"
                                               aria-label="Username" aria-describedby="basic-addon1">
                                    </div>
                                    <div class="mb-3">
                                        <label for="exampleInputPassword1" class="form-label">Сообщение</label>
                                        <textarea class="form-control" id="exampleInputPassword1" rows="3"></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-primary">Отправить</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    <div class="col-sm-6">
                        <div class="card text-start">
                            <div class="card-body">
                                <h3 class="card-title">Наши контакты:</h3>
                                <p class="card-text">Т‑Банк — онлайн-экосистема, основанная на финансовых и
                                    лайфстайл-услугах.
                                    Клиентами Т‑Банка стали 54 млн человек по всей России. Т‑Банк — второй крупнейший
                                    банк страны по количеству активных клиентов.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-1"></div>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
